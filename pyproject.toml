[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "playlistbridge"
version = "0.1.0"
description = "Local Spotify-to-YouTube Music playlist transfer helper"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "PlaylistBridge contributors" },
]
dependencies = [
  "requests>=2.32,<3",
  "ytmusicapi>=1.10,<2",
]

[project.scripts]
playlistbridge = "playlistbridge.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
